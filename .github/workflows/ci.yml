name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, migrations and OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_banks_discounts
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_banks_discounts"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ENV: ci
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: test_banks_discounts
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: disable
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/test_banks_discounts
      ENABLE_AI_ENRICHMENT: "false"
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.lock
            api/requirements-test.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements-test.lock
      - name: Check versioned API contract
        run: python -m scripts.export_openapi --check
      - name: Migrate a fresh test database and check model drift
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: Test bank adapters and integration
        run: python -m pytest -q -ra
      - name: Upload API contract
        uses: actions/upload-artifact@v7
        with:
          name: openapi
          path: api/contracts/openapi.json

  docker:
    name: Build container and validate Compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build API and scraper image
        run: docker build --tag banks-discounts-ci ./api
      - name: Validate development and production configuration
        env:
          DB_HOST: neon.example.invalid
          DB_NAME: test_banks_discounts
          DB_USER: ci-placeholder-user
          DB_PASSWORD: ci-placeholder-password
          API_ACCESS_KEY: ci-placeholder-api-key
          API_DOMAIN: api.example.invalid
          TLS_EMAIL: ci@example.invalid
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile scraping config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile scraping config --quiet
          cp neon.env.example neon.env
          docker compose --env-file neon.env -f docker-compose.neon.yml config --quiet
      - name: Validate HTTPS proxy configuration
        env:
          API_ACCESS_KEY: ci-placeholder-api-key
          API_DOMAIN: api.example.invalid
          TLS_EMAIL: ci@example.invalid
        run: >-
          docker run --rm --env API_ACCESS_KEY --env API_DOMAIN --env TLS_EMAIL
          --mount "type=bind,source=$PWD/docker/Caddyfile,target=/etc/caddy/Caddyfile,readonly"
          caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Verify the direct API access gate and Render port
        run: |
          docker run --detach --name render-smoke \
            --publish 127.0.0.1:18081:10001 \
            --env PORT=10001 \
            --env DB_HOST=127.0.0.1 --env DB_PORT=5432 \
            --env DB_NAME=test_banks_discounts --env DB_USER=postgres \
            --env DB_PASSWORD=ci-placeholder-password \
            --env API_ACCESS_KEY=ci-placeholder-api-key \
            banks-discounts-ci sh docker/start-render.sh
          trap 'docker rm -f render-smoke >/dev/null' EXIT
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:18081/healthz >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18081/openapi.json)" = 401
          curl --fail --silent --header 'X-API-Key: ci-placeholder-api-key' \
            http://127.0.0.1:18081/openapi.json >/dev/null

  frontend-contract:
    name: Contract against frontend
    # Enable after the frontend has a GitHub repository. Frontend CI always
    # checks the backend; this job also catches backend-only contract changes.
    if: ${{ vars.FRONTEND_REPOSITORY != '' }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_banks_discounts
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_banks_discounts"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ENV: ci
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: test_banks_discounts
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: disable
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/test_banks_discounts
      ENABLE_AI_ENRICHMENT: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          path: backend
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.FRONTEND_REPOSITORY }}
          ref: ${{ vars.FRONTEND_REF || '' }}
          token: ${{ secrets.FRONTEND_READ_TOKEN || github.token }}
          path: frontend
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/api/requirements.lock
            backend/api/requirements-test.lock
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install backend dependencies
        working-directory: backend/api
        run: python -m pip install -r requirements-test.lock
      - name: Check shared schema and generated types
        working-directory: frontend
        run: npm run contracts:check -- "$GITHUB_WORKSPACE/backend/api/contracts/openapi.json"
      - name: Test frontend against this backend revision
        working-directory: backend/api
        run: python -m scripts.check_frontend_contract --frontend "$GITHUB_WORKSPACE/frontend"
