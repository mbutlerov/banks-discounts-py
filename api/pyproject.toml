[project]
name = "banks-discounts-api"
version = "0.1.0"
description = "A FastAPI project for managing bank discounts"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
    "sqlalchemy>=2.0",
    "alembic>=1.18",
    "requests>=2.32",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.1",
    "pypdf>=5.0.0",
    "pdfplumber>=0.11",
    "pypdfium2>=5.0",
    "pillow>=12.0",
    "beautifulsoup4>=4.12",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["environments*", "enviroments*", "tests*"]
