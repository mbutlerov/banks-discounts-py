# compose.dev.yml (solo dev)
services:
  db:
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: dev_banks_discounts
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

  api:
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./api/environments/dev.env
      - path: ./api/environments/private.env
        required: false
    volumes:
      - ./api/app:/app/app
      - ./api/alembic:/app/alembic
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    command: >
      python -m uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/app

  scraper:
    env_file:
      - ./api/environments/dev.env
      - path: ./api/environments/private.env
        required: false
    volumes:
      - ./api/app:/app/app
